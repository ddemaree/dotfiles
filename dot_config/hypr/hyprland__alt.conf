exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
$mod=SUPER
animations {
  bezier=snappy, 0.05, 0.9, 0.1, 1.0
  animation=windows, 1, 5, snappy, slide
  animation=windowsOut, 1, 5, snappy, slide
  animation=fade, 1, 5, snappy
  animation=workspaces, 1, 4, snappy, slide
  animation=border, 1, 5, snappy
  enabled=true
}

bind=$mod, Return, exec, ghostty
bind=$mod, Q, killactive
bind=$mod, Space, exec, rofi -show drun -show-icons
# bind=$mod, slash, exec, /nix/store/d17bfmrqq95fv86x5mvdvddx2qyq3q8p-hypr-keybinds
bind=$mod, E, exec, nautilus
bind=$mod, Escape, exec, hyprlock
bind=$mod, F, fullscreen, 1
bind=$mod SHIFT, F, fullscreen, 0
bind=$mod, V, togglefloating
bind=$mod, P, pseudo
bind=$mod, S, togglesplit
bind=$mod, H, movefocus, l
bind=$mod, L, movefocus, r
bind=$mod, K, movefocus, u
bind=$mod, J, movefocus, d
bind=$mod SHIFT, H, movewindow, l
bind=$mod SHIFT, L, movewindow, r
bind=$mod SHIFT, K, movewindow, u
bind=$mod SHIFT, J, movewindow, d
bind=$mod, 1, workspace, 1
bind=$mod, 2, workspace, 2
bind=$mod, 3, workspace, 3
bind=$mod, 4, workspace, 4
bind=$mod, 5, workspace, 5
bind=$mod, 6, workspace, 6
bind=$mod, 7, workspace, 7
bind=$mod, 8, workspace, 8
bind=$mod, 9, workspace, 9
bind=$mod, 0, workspace, 10
bind=$mod SHIFT, 1, movetoworkspace, 1
bind=$mod SHIFT, 2, movetoworkspace, 2
bind=$mod SHIFT, 3, movetoworkspace, 3
bind=$mod SHIFT, 4, movetoworkspace, 4
bind=$mod SHIFT, 5, movetoworkspace, 5
bind=$mod SHIFT, 6, movetoworkspace, 6
bind=$mod SHIFT, 7, movetoworkspace, 7
bind=$mod SHIFT, 8, movetoworkspace, 8
bind=$mod SHIFT, 9, movetoworkspace, 9
bind=$mod SHIFT, 0, movetoworkspace, 10
bind=$mod, mouse_down, workspace, e+1
bind=$mod, mouse_up, workspace, e-1
bind=, Print, exec, grimblast copy area
bind=$mod SHIFT, S, exec, grimblast copy area

bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel=, XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel=, XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPrev, exec, playerctl previous

bindm=$mod, mouse:272, movewindow
bindm=$mod, mouse:273, resizewindow

cursor {
  no_hardware_cursors=true
}

decoration {
  blur {
    enabled=true
    ignore_opacity=true
    passes=3
    size=5
  }

  shadow {
    color=rgba(11111b99)
    enabled=true
    range=8
    render_power=2
  }
  rounding=8
}

dwindle {
  preserve_split=true
  pseudotile=true
}

env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24
env=XCURSOR_THEME,Bibata-Modern-Classic
env=GDK_SCALE,2
env=STEAM_FORCE_DESKTOPUI_SCALING,2
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_CURRENT_DESKTOP,Hyprland
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,Hyprland
env=QT_QPA_PLATFORM,wayland;xcb
env=GDK_BACKEND,wayland,x11,*
env=MOZ_ENABLE_WAYLAND,1
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=QT_STYLE_OVERRIDE,kvantum
env=OZONE_PLATFORM,wayland
env=SDL_VIDEODRIVER,wayland,x11

exec-once=gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once=dunst
exec-once=hyprpaper
exec-once=waybar
exec-once=nm-applet --indicator
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

general {
  allow_tearing=false
  border_size=2
  col.active_border=rgba(b4befeee) rgba(cba6f7ee) 45deg
  col.inactive_border=rgba(313244aa)
  gaps_in=4
  gaps_out=8
  layout=dwindle
}

input {
  touchpad {
    drag_lock=true
    natural_scroll=true
    tap-to-click=true
  }
  follow_mouse=1
  kb_layout=us
  sensitivity=0
}

misc {
  disable_hyprland_logo=true
}

monitor=eDP-1, 2560x1600@165, 0x0, 1.6
monitor=desc:LG Electronics LG SDQHD 208NTMX6P611, preferred, auto, 1.33
monitor=, preferred, auto, auto

windowrule=float on, match:class ^(pavucontrol)$
windowrule=float on, match:class ^(nm-connection-editor)$
windowrule=float on, match:class ^(1Password)$
windowrule=float on, match:title ^(Open File)$
windowrule=float on, match:title ^(Open Folder)$
windowrule=float on, match:title ^(Save As)$
windowrule=float on, match:title ^(File Upload)$
windowrule=float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule=float on, match:class ^(org.gnome.Nautilus)$, match:title ^(Properties)$

xwayland {
  force_zero_scaling=true
}
gesture=3, horizontal, workspace
