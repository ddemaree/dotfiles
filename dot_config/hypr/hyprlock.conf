general {
    ignore_empty_input = true
    hide_cursor = true
    grace = 5          # seconds after lock where you can unlock without password
    enable_fingerprint = true
    fingerprint_ready_message = Scan fingerprint to unlock
    fingerprint_present_message = Scanning...
}

background {
    monitor =
    color = rgba(25, 25, 30, 1.0)
}

# background {
#     monitor =
#     color = $color
#     path = ~/.config/omarchy/current/background
#     blur_passes = 3
# }

animations {
    enabled = false
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(100, 100, 180, 1.0)
    inner_color = rgba(40, 40, 50, 1.0)
    font_color = rgba(200, 200, 220, 1.0)
    font_family = GT Standard Mono
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

